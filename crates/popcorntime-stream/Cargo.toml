[package]
name = "popcorntime-stream"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[dependencies]
librqbit = { version = "9.1.0", default-features = false, features = ["http-api", "tracing-subscriber-utils", "default-tls"] }
librqbit-dualstack-sockets = "0.7.0"
axum = "0.8"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, features = ["serde", "derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "fs", "io-util", "process", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
